<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZYNVORA ADMIN</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff;padding:15px}h1{margin:10px 0}.card{background:#111;border:1px solid #222;padding:12px;border-radius:10px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}button{padding:6px 12px;border-radius:20px;border:none;cursor:pointer;font-weight:700}.ban{background:#fe2c55;color:#fff}.unban{background:#25f4ee;color:#000}.del{background:#333;color:#fff}.tab{display:flex;gap:10px;margin:15px 0}.tab div{padding:8px 15px;background:#222;border-radius:20px;cursor:pointer}.tab div.active{background:#fff;color:#000}.login{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.login .box{background:#111;border:1px solid #222;padding:25px;border-radius:15px;width:100%;max-width:320px}input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff}</style></head><body><div class="login" id="loginBox"><div class="box"><h2>Admin Login</h2><p style="color:#888;font-size:14px;margin:5px 0">Only owner can access</p><input id="adminPass" type="password" placeholder="Enter Admin Password"><button style="width:100%;padding:12px;background:#fe2c55;color:#fff;border-radius:10px;margin-top:10px" onclick="adminLogin()">Login</button><p style="margin-top:10px"><a href="/" style="color:#25f4ee">← Back to App</a></p></div></div><h1>ZYNVORA ADMIN</h1><a href="/" style="color:#25f4ee">← Back to App</a><div class="tab"><div class="active" onclick="show('users')" id="t-users">Users</div><div onclick="show('videos')" id="t-videos">Videos</div><div onclick="show('msgs')" id="t-msgs">Messages</div></div><div id="usersSec"></div><div id="videosSec" style="display:none"></div><div id="msgsSec" style="display:none"></div><script>let ADMIN_PASS=localStorage.getItem('zyn_admin_pass')||'';if(ADMIN_PASS){checkPass(ADMIN_PASS);}async function adminLogin(){const p=document.getElementById('adminPass').value;const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const data=await res.json();if(data.success){localStorage.setItem('zyn_admin_pass',p);ADMIN_PASS=p;document.getElementById('loginBox').style.display='none';loadAll();}else alert('Wrong Password!');}async function checkPass(p){const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const data=await res.json();if(data.success)document.getElementById('loginBox').style.display='none';}async function loadAll(){let u=await fetch('/api/users').then(r=>r.json());let v=await fetch('/api/videos').then(r=>r.json());let m=await fetch('/api/messages').then(r=>r.json());document.getElementById('usersSec').innerHTML=u.length?u.map(x=>`<div class="card"><div><b>@${x.username}</b> (${x.fullName})<br><small>${x.banned?'<span style=color:red> [BANNED]</span>':''}</small></div><div><button class="${x.banned?'unban':'ban'}" onclick="ban(${x.id})">${x.banned?'Unban':'Ban'}</button> <button class="del" onclick="delUser(${x.id})">Delete</button></div></div>`).join(''):'No users';document.getElementById('videosSec').innerHTML=v.length?v.map(x=>`<div class="card"><div><b>@${x.username}</b> - ${x.caption}<br><small>${x.videoUrl.slice(0,40)}</small></div><div><button class="del" onclick="delVideo(${x.id})">Delete</button></div></div>`).join(''):'No videos';document.getElementById('msgsSec').innerHTML=m.length?m.map(x=>`<div class="card"><div><b>@${x.from}</b>: ${x.text}</div></div>`).join(''):'No messages';}async function ban(id){await fetch('/api/ban/'+id,{method:'POST',headers:{'x-admin-pass':ADMIN_PASS}});loadAll();}async function delUser(id){if(confirm('Delete user?')){await fetch('/api/users/'+id,{method:'DELETE',headers:{'x-admin-pass':ADMIN_PASS}});loadAll();}}async function delVideo(id){if(confirm('Delete video?')){await fetch('/api/videos/'+id,{method:'DELETE',headers:{'x-admin-pass':ADMIN_PASS}});loadAll();}}function show(t){document.getElementById('usersSec').style.display=t==='users'?'block':'none';document.getElementById('videosSec').style.display=t==='videos'?'block':'none';document.getElementById('msgsSec').style.display=t==='msgs'?'block':'none';document.querySelectorAll('.tab div').forEach(d=>d.classList.remove('active'));document.getElementById('t-'+t).classList.add('active');}loadAll();</script></body></html>
