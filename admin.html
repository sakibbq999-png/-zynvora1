<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZYNVORA ADMIN</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;padding:20px}.login-box{max-width:350px;margin:80px auto;background:#111;border:1px solid #222;padding:25px;border-radius:15px;text-align:center}input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff}.btn{padding:10px 20px;border-radius:20px;border:none;font-weight:700;cursor:pointer;width:100%;margin-top:10px}.btn-pink{background:#fe2c55;color:#fff}.btn-white{background:#fff;color:#000}.hidden{display:none!important}.panel{max-width:900px;margin:0 auto}.tabs{display:flex;gap:10px;margin:20px 0;overflow-x:auto}.tab{padding:8px 18px;background:#111;border:1px solid #222;border-radius:20px;cursor:pointer;font-size:13px}.tab.active{background:#fe2c55;border-color:#fe2c55}.card{background:#111;border:1px solid #222;padding:15px;border-radius:12px;margin:10px 0;font-size:13px}.card .top{display:flex;justify-content:space-between;align-items:center}.badge{padding:3px 8px;border-radius:10px;font-size:10px;background:#222}.actions{margin-top:10px;display:flex;gap:8px}.actions button{padding:6px 12px;border-radius:15px;border:none;cursor:pointer;font-size:11px;font-weight:700}.b-ban{background:#ff9500;color:#fff}.b-del{background:#fe2c55;color:#fff}.b-view{background:#25f4ee;color:#000}</style></head><body><div class="login-box" id="loginBox"><h2>ZYNVORA ADMIN</h2><p style="color:#666;font-size:12px;margin:8px 0 15px">Enter Admin Password</p><input id="pass" type="password" placeholder="Admin Password"><button class="btn btn-pink" onclick="login()">Login</button><p style="margin-top:10px"><a href="/" style="color:#666;font-size:12px">← Back to App</a></p></div><div class="panel hidden" id="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>ADMIN PANEL</h2><button class="btn-white" style="padding:6px 12px;border-radius:15px;border:none;cursor:pointer;font-size:11px" onclick="logout()">Logout</button></div><div class="tabs"><div class="tab active" onclick="showTab('users')">👥 Users (<span id="uCount">0</span>)</div><div class="tab" onclick="showTab('videos')">🎬 Videos (<span id="vCount">0</span>)</div><div class="tab" onclick="showTab('messages')">💬 Messages (<span id="mCount">0</span>)</div></div><div id="usersTab"></div><div id="videosTab" class="hidden"></div><div id="messagesTab" class="hidden"></div></div><script>const ADMIN_PASS="ZYNVORA123";let adminPass=localStorage.getItem('zyn_admin_pass')||"";let currentTab='users';function init(){if(adminPass){document.getElementById('loginBox').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAll();}}async function login(){const p=document.getElementById('pass').value.trim();if(!p)return alert('Enter password');const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const data=await res.json();if(data.error)return alert('Wrong password');adminPass=p;localStorage.setItem('zyn_admin_pass',p);document.getElementById('loginBox').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadAll();}function logout(){localStorage.removeItem('zyn_admin_pass');location.reload();}function showTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('usersTab').classList.add('hidden');document.getElementById('videosTab').classList.add('hidden');document.getElementById('messagesTab').classList.add('hidden');if(t==='users'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('usersTab').classList.remove('hidden');}if(t==='videos'){document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('videosTab').classList.remove('hidden');}if(t==='messages'){document.querySelectorAll('.tab')[2].classList.add('active');document.getElementById('messagesTab').classList.remove('hidden');}loadAll();}async function loadAll(){const [uRes,vRes,mRes]=await Promise.all([fetch('/api/users'),fetch('/api/videos'),fetch('/api/messages')]);const users=await uRes.json();const videos=await vRes.json();const messages=await mRes.json();document.getElementById('uCount').innerText=users.length;document.getElementById('vCount').innerText=videos.length;document.getElementById('mCount').innerText=messages.length;document.getElementById('usersTab').innerHTML=users.map(u=>`<div class="card"><div class="top"><div><b>@${u.username}</b> - ${u.fullName||''}<br><span style="color:#888;font-size:11px">${u.created?new Date(u.created).toLocaleString():''} | ID:${u.id}</span></div><span class="badge" style="background:${u.banned?'#fe2c55':'#25f4ee'};color:${u.banned?'#fff':'#000'}">${u.banned?'BANNED':'ACTIVE'}</span></div><div class="actions"><button class="b-ban" onclick="banUser(${u.id})">${u.banned?'Unban':'Ban'}</button><button class="b-del" onclick="delUser(${u.id})">Delete</button></div></div>`).join('')||'<div style="color:#555">No users</div>';document.getElementById('videosTab').innerHTML=videos.map(v=>`<div class="card"><div class="top"><div><b>@${v.username}</b> - ${v.type}<br><span style="color:#888">${(v.caption||'').slice(0,50)}</span><br><a href="${v.videoUrl}" target="_blank" style="color:#25f4ee;font-size:11px">Open Link</a></div><span class="badge">❤️ ${v.likes}</span></div><div class="actions"><button class="b-del" onclick="delVideo(${v.id})">Delete Video</button></div></div>`).join('')||'<div style="color:#555">No videos</div>';document.getElementById('messagesTab').innerHTML=messages.slice().reverse().map(m=>`<div class="card"><div class="top"><div><b>${m.from}</b> → <b>${m.to}</b><br><span style="color:#fff">${m.text}</span><br><span style="color:#888;font-size:11px">${new Date(m.created).toLocaleString()}</span></div></div></div>`).join('')||'<div style="color:#555">No messages</div>';}async function banUser(id){if(!confirm('Ban/Unban this user?'))return;await fetch('/api/ban/'+id,{method:'POST',headers:{'x-admin-pass':adminPass}});loadAll();}async function delUser(id){if(!confirm('Delete this user permanently?'))return;await fetch('/api/users/'+id,{method:'DELETE',headers:{'x-admin-pass':adminPass}});loadAll();}async function delVideo(id){if(!confirm('Delete this video?'))return;await fetch('/api/videos/'+id,{method:'DELETE',headers:{'x-admin-pass':adminPass}});loadAll();}init();</script></body></html>
