<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZYNVORA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#000;color:#fff}.header{position:fixed;top:0;left:0;right:0;background:#000;border-bottom:1px solid #1a1a1a;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;z-index:100}.logo{font-weight:900;font-size:18px;letter-spacing:3px}.logo span{color:#fe2c55}.search-bar{position:fixed;top:52px;left:0;right:0;background:#000;padding:8px 12px;z-index:99;border-bottom:1px solid #111;display:flex;gap:8px}.search-bar input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid #333;background:#121212;color:#fff;font-size:13px}.search-bar button{padding:8px 14px;border-radius:20px;background:#222;color:#fff;border:none}.auth-box{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#101010;border:1px solid #222;padding:20px;border-radius:16px;width:100%;max-width:360px}.card input{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:13px}.btn{padding:10px;border-radius:20px;border:none;font-weight:700;cursor:pointer}.btn-pink{background:#fe2c55;color:#fff;width:100%;margin-top:8px}.btn-white{background:#fff;color:#000}.feed{margin-top:102px;padding-bottom:75px}.user-list{display:flex;gap:10px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid #111}.user-list::-webkit-scrollbar{display:none}.user-item{min-width:60px;text-align:center;cursor:pointer}.avatar{width:44px;height:44px;background:linear-gradient(135deg,#25f4ee,#fe2c55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;margin:0 auto 4px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.video-card{background:#0a0a0a;margin:8px 10px;border-radius:14px;overflow:hidden;border:1px solid #1a1a1a}.video-card video,.video-card img{width:100%;max-height:70vh;object-fit:contain;background:#000}.info{padding:10px 12px}.actions{display:flex;gap:18px;margin-top:8px;font-size:14px}.actions span{cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:6px 0 10px;z-index:90}.bottom div{cursor:pointer;text-align:center;font-size:10px;color:#666}.bottom div.active{color:#fff}.bottom .ico{font-size:19px;display:block}.bottom .center{background:#fff;color:#000;width:38px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}.upload-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}.upload-modal.active{display:flex}.hidden{display:none!important}.me-box{text-align:center;padding:20px}.me-avatar{width:85px;height:85px;background:linear-gradient(135deg,#25f4ee,#fe2c55);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;overflow:hidden;cursor:pointer;border:2px solid #222}.me-avatar img{width:100%;height:100%;object-fit:cover}.comment-item{padding:6px 0;border-bottom:1px solid #111;font-size:12px}.comment-item b{color:#25f4ee}.chat-box{max-height:250px;overflow:auto;margin:10px 0;background:#080808;border-radius:12px;padding:10px;border:1px solid #1a1a1a}.msg{padding:6px 10px;margin:4px 0;border-radius:14px;max-width:75%;font-size:13px}.msg.me{background:#fe2c55;margin-left:auto}.msg.other{background:#222}</style></head><body><div class="header"><div class="logo">ZYN<span>VORA</span></div><div id="topUser" style="font-size:12px;color:#25f4ee"></div></div><div class="search-bar"><input id="searchInput" placeholder="Search username..." oninput="doSearch()"><button onclick="doSearch()">⌕</button></div><div class="auth-box" id="authBox"><div class="card"><h2 id="authTitle">Create Account</h2><input id="fullName" placeholder="Full Name"><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button class="btn btn-pink" onclick="handleAuth()">Continue</button><p style="margin-top:10px;text-align:center;color:#666;font-size:12px"><span onclick="toggleAuth()" id="toggleText" style="cursor:pointer">Already have account? Login</span></p></div></div><div class="feed" id="mainFeed"><div class="user-list" id="userList"></div><div id="feed"></div><div id="meTab" class="hidden"><div class="me-box"><div class="me-avatar" id="meAvatar" onclick="document.getElementById('profileFile').click()">S</div><input type="file" id="profileFile" accept="image/*" style="display:none" onchange="uploadProfilePic()"><h3 id="meName">@Sami</h3><p style="color:#888;font-size:12px" id="meFull"></p><p style="color:#555;font-size:10px;margin-top:5px">Tap picture to change profile photo</p><button class="btn btn-white" style="margin-top:15px;width:120px" onclick="logout()">Logout</button></div></div></div><div class="bottom"><div onclick="showHome()" id="bHome" class="active"><span class="ico">⌂</span>Home</div><div onclick="showHome();document.getElementById('searchInput').focus()" id="bSearch"><span class="ico">⌕</span>Search</div><div onclick="openUpload()"><div class="center">+</div></div><div onclick="showInbox()" id="bInbox"><span class="ico">◍</span>Inbox</div><div onclick="showMe()" id="bMe"><span class="ico">◉</span>Me</div></div><div class="upload-modal" id="uploadModal"><div class="card"><h3>Upload Video / Photo</h3><input type="file" id="fileInput" accept="video/*,image/*"><input id="videoUrl" placeholder="Or paste direct link"><input id="caption" placeholder="Caption..."><button class="btn btn-pink" onclick="uploadContent()">Upload</button><button class="btn" style="background:#222;color:#fff;width:100%;margin-top:6px" onclick="closeUpload()">Cancel</button></div></div><div class="upload-modal" id="commentModal"><div class="card"><h3 id="commentTitle">Comments</h3><div class="chat-box" id="commentBox"></div><input id="commentText" placeholder="Add a comment..."><button class="btn btn-pink" onclick="addComment()">Post</button><button class="btn" style="background:#222;color:#fff;width:100%;margin-top:6px" onclick="closeComment()">Close</button></div></div><div class="upload-modal" id="chatModal"><div class="card"><h3 id="chatWith">Chat</h3><div class="chat-box" id="chatBox"></div><input id="msgText" placeholder="Message..."><button class="btn btn-pink" onclick="sendMsg()">Send</button><button class="btn" style="background:#222;color:#fff;width:100%;margin-top:6px" onclick="closeChat()">Close</button></div></div><script>let currentUser=JSON.parse(localStorage.getItem('zyn_user')||'null');let isLogin=false,chatUser=null,commentVideoId=null;function init(){if(currentUser){document.getElementById('authBox').classList.add('hidden');document.getElementById('topUser').innerText='@'+currentUser.username;updateMeUI();}loadFeed();loadUsers();}function updateMeUI(){const av=document.getElementById('meAvatar');if(currentUser.avatar){av.innerHTML=`<img src="${currentUser.avatar}">`}else{av.innerText=currentUser.username[0].toUpperCase()}document.getElementById('meName').innerText='@'+currentUser.username;document.getElementById('meFull').innerText=currentUser.fullName||''}function toggleAuth(){isLogin=!isLogin;document.getElementById('authTitle').innerText=isLogin?'Login':'Create';document.getElementById('fullName').style.display=isLogin?'none':'block';document.getElementById('toggleText').innerText=isLogin?'Need account? Create':'Already have account? Login';}async function handleAuth(){const u=username.value.trim(),p=password.value.trim(),f=fullName.value.trim();if(!u||!p)return alert('Fill');const url=isLogin?'/api/login':'/api/register';const body=isLogin?{username:u,password:p}:{username:u,fullName:f,password:p};const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await res.json();if(d.error)return alert(d.error);currentUser=d.user;localStorage.setItem('zyn_user',JSON.stringify(currentUser));location.reload();}function logout(){localStorage.removeItem('zyn_user');location.reload();}async function loadUsers(q=''){const r=await fetch('/api/users');let users=await r.json();if(q)users=users.filter(u=>u.username.toLowerCase().includes(q.toLowerCase()));document.getElementById('userList').innerHTML=users.filter(u=>!currentUser||u.username!==currentUser.username).map(u=>`<div class="user-item" onclick="openChat('${u.username}')"><div class="avatar">${u.avatar?`<img src="${u.avatar}">`:u.username[0].toUpperCase()}</div><div style="font-size:9px;color:#888">@${u.username.slice(0,8)}</div></div>`).join('')||'<div style="padding:8px;color:#555;font-size:11px">No users</div>';}function doSearch(){const q=searchInput.value.trim();loadUsers(q);q?loadFeed(q):loadFeed();}async function loadFeed(q=''){const r=await fetch('/api/videos');let videos=await r.json();if(q)videos=videos.filter(v=>v.username.toLowerCase().includes(q.toLowerCase()));const feed=document.getElementById('feed');if(!videos.length){feed.innerHTML='<div style="text-align:center;padding:40px;color:#555">No Videos Yet</div>';return;}feed.innerHTML=videos.map(v=>`<div class="video-card">${v.videoUrl.match(/\.mp4|mov|webm/i)||v.videoUrl.includes('/uploads/')&&!v.videoUrl.match(/\.jpg|\.png|\.jpeg/i)?`<video src="${v.videoUrl}" controls loop playsinline></video>`:`<img src="${v.videoUrl}">`}<div class="info"><div style="display:flex;justify-content:space-between"><b style="font-size:13px">@${v.username}</b><span style="color:#25f4ee;font-size:11px;cursor:pointer" onclick="openChat('${v.username}')">Message</span></div><div style="color:#aaa;margin-top:4px;font-size:12px">${v.caption||''}</div><div class="actions"><span onclick="like(${v.id})">❤️ ${v.likes}</span><span onclick="openComment(${v.id})">💬 ${v.comments||0}</span><span onclick="shareVideo('${v.videoUrl}')">↗ Share</span></div></div></div>`).join('');}async function like(id){if(!currentUser)return alert('Login');await fetch('/api/like/'+id,{method:'POST'});loadFeed(searchInput.value.trim());}function shareVideo(url){navigator.clipboard.writeText(location.origin+url);alert('Link Copied! '+url);}function openUpload(){if(!currentUser)return alert('Login');uploadModal.classList.add('active');}function closeUpload(){uploadModal.classList.remove('active');}async function uploadContent(){const file=fileInput.files[0];const urlV=videoUrl.value.trim();const cap=caption.value.trim();if(!file&&!urlV)return alert('Select file or link');let videoUrlFinal=urlV;if(file){const fd=new FormData();fd.append('file',file);const res=await fetch('/api/upload',{method:'POST',body:fd});const d=await res.json();videoUrlFinal=d.url;}await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,videoUrl:videoUrlFinal,caption:cap,type:'video'})});closeUpload();loadFeed();videoUrl.value='';fileInput.value='';caption.value='';}async function uploadProfilePic(){const file=profileFile.files[0];if(!file)return;const fd=new FormData();fd.append('file',file);const res=await fetch('/api/upload',{method:'POST',body:fd});const d=await res.json();const r2=await fetch('/api/profile/avatar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,avatar:d.url})});const u=await r2.json();currentUser=u.user;localStorage.setItem('zyn_user',JSON.stringify(currentUser));updateMeUI();alert('Profile picture updated!');}function showHome(){meTab.classList.add('hidden');feed.classList.remove('hidden');userList.classList.remove('hidden');setActive('bHome');loadFeed();}function showMe(){if(!currentUser)return alert('Login');feed.classList.add('hidden');userList.classList.add('hidden');meTab.classList.remove('hidden');setActive('bMe');}function showInbox(){meTab.classList.add('hidden');feed.classList.remove('hidden');userList.classList.remove('hidden');setActive('bInbox');userList.scrollIntoView({behavior:'smooth'});}function setActive(id){document.querySelectorAll('.bottom div').forEach(d=>d.classList.remove('active'));document.getElementById(id).classList.add('active');}function openComment(id){commentVideoId=id;commentModal.classList.add('active');loadComments();}function closeComment(){commentModal.classList.remove('active');commentVideoId=null;}async function loadComments(){const r=await fetch('/api/comments/'+commentVideoId);const list=await r.json();commentBox.innerHTML=list.map(c=>`<div class="comment-item"><b>@${c.username}</b> ${c.text}</div>`).join('')||'<div style="color:#555;font-size:11px">No comments yet</div>';}async function addComment(){const t=commentText.value.trim();if(!t)return;await fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({videoId:commentVideoId,username:currentUser.username,text:t})});commentText.value='';loadComments();loadFeed();}function openChat(u){if(!currentUser)return alert('Login');chatUser=u;chatWith.innerText='Chat with @'+u;chatModal.classList.add('active');loadChat();}function closeChat(){chatModal.classList.remove('active');chatUser=null;}async function loadChat(){if(!chatUser)return;const r=await fetch(`/api/messages?user=${currentUser.username}&with=${chatUser}`);const msgs=await r.json();chatBox.innerHTML=msgs.map(m=>`<div class="msg ${m.from===currentUser.username?'me':'other'}">${m.text}</div>`).join('')||'<div style="color:#555">No messages</div>';}async function sendMsg(){const t=msgText.value.trim();if(!t)return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:currentUser.username,to:chatUser,text:t})});msgText.value='';loadChat();}init();</script></body></html>
