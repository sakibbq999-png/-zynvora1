<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZYNVORA</title>
<style>
body{background:#000;color:#fff;margin:0;font-family:sans-serif}
.video-box{height:100vh;position:relative;overflow:hidden;border-bottom:1px solid #222}
video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:20px;left:10px}
.btn{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:15px}
.btn button{background:none;border:none;font-size:28px;color:#fff}
.top{position:fixed;top:0;width:100%;text-align:center;background:linear-gradient(#000,transparent);padding:15px;z-index:10;font-weight:bold;font-size:20px}
</style>
</head>
<body>
<div class="top">ZYNVORA</div>
<div id="feed"></div>
<script>
async function load(){
 let r=await fetch('/api/videos');
 let vids=await r.json();
 let feed=document.getElementById('feed');
 if(vids.length==0){feed.innerHTML='<p style="text-align:center;margin-top:50%">No Videos Yet<br>Add from /admin</p>';return}
 feed.innerHTML='';
 vids.forEach(v=>{
  feed.innerHTML+=`<div class="video-box">
   <video src="${v.videoUrl}" loop autoplay muted playsinline onclick="this.paused?this.play():this.pause()"></video>
   <div class="info"><b>@${v.username}</b><br>${v.descp||''}</div>
   <div class="btn"><button>❤️ ${v.likes||0}</button><button>💬</button><button>↗️</button></div>
  </div>`;
 });
}
load();
</script>
</body>
</html>
