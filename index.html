<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZYNVORA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#000;color:#fff;overflow-x:hidden}.header{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);border-bottom:1px solid #1a1a1a;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;z-index:100}.logo{font-weight:900;font-size:18px;letter-spacing:3px;color:#fff;text-shadow:0 0 10px #25f4ee}.logo span{color:#fe2c55}.btn{padding:6px 14px;border-radius:20px;border:none;font-weight:700;cursor:pointer;font-size:12px}.btn-pink{background:#fe2c55;color:#fff;box-shadow:0 0 10px rgba(254,44,85,0.5)}.btn-white{background:#fff;color:#000}.auth-box{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#0f0f0f;border:1px solid #222;padding:22px;border-radius:16px;width:100%;max-width:340px}input{width:100%;padding:11px;margin:7px 0;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:13px}.feed{margin-top:52px;padding-bottom:70px}.user-list{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid #111}.user-list::-webkit-scrollbar{display:none}.user-item{min-width:56px;text-align:center;cursor:pointer}.user-item .avatar{width:42px;height:42px;background:linear-gradient(135deg,#25f4ee,#fe2c55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin:0 auto 4px;box-shadow:0 0 8px rgba(37,244,238,0.3)}.video-card{background:#0a0a0a;margin:8px 10px;border-radius:14px;overflow:hidden;border:1px solid #1a1a1a;position:relative}.video-card video,.video-card img{width:100%;max-height:68vh;object-fit:contain;background:#000}.info{padding:10px 12px}.user{font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}.caption{color:#aaa;margin-top:4px;font-size:12px}.actions{display:flex;gap:12px;margin-top:8px;font-size:12px}.actions span{cursor:pointer;opacity:0.8}.actions span:hover{opacity:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(15px);border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:6px 0 8px;z-index:90}.bottom div{cursor:pointer;text-align:center;font-size:9px;color:#888;transition:0.2s}.bottom div.active{color:#fff;text-shadow:0 0 5px #25f4ee}.bottom div .ico{font-size:18px;display:block;margin-bottom:2px}.upload-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}.upload-modal.active{display:flex}.hidden{display:none!important}.chat-box{max-height:280px;overflow:auto;margin:10px 0;background:#080808;border-radius:12px;padding:10px;border:1px solid #1a1a1a}.msg{padding:6px 10px;margin:4px 0;border-radius:14px;max-width:75%;font-size:13px}.msg.me{background:linear-gradient(135deg,#fe2c55,#ff6b8a);margin-left:auto;color:#fff}.msg.other{background:#1e1e1e;color:#ddd}</style></head><body><div class="header"><div class="logo">ZYN<span>VORA</span></div><div><span id="userName" style="font-size:12px;color:#25f4ee"></span> <button class="btn btn-white" id="logoutBtn" style="display:none" onclick="logout()">Logout</button></div></div><div class="auth-box" id="authBox"><div class="card"><h2 id="authTitle" style="font-size:18px">Create Account</h2><input id="fullName" placeholder="Full Name"><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button class="btn btn-pink" style="width:100%;margin-top:10px;padding:11px" onclick="handleAuth()">Continue</button><p style="margin-top:12px;text-align:center;color:#666;font-size:12px"><span onclick="toggleAuth()" id="toggleText" style="cursor:pointer;text-decoration:underline">Already have account? Login</span></p></div></div><div class="feed"><div class="user-list" id="userList"></div><div id="feed"></div></div><div class="bottom"><div onclick="scrollToTop()" class="active"><span class="ico">⌂</span>Home</div><div onclick="openUpload('video')"><span class="ico">◉</span>Video</div><div onclick="openUpload('story')"><span class="ico">✦</span>Story</div><div onclick="openUsers()"><span class="ico">◍</span>Inbox</div></div><div class="upload-modal" id="uploadModal"><div class="card" style="max-width:380px"><h3 id="uploadTitle" style="font-size:15px">Upload Video</h3><input id="videoUrl" placeholder="Video/Image URL (mp4, jpg link)"><input id="caption" placeholder="Caption..."><button class="btn btn-pink" style="width:100%;margin-top:10px;padding:11px" onclick="uploadContent()">Upload</button><button class="btn btn-white" style="width:100%;margin-top:8px;padding:10px" onclick="closeUpload()">Cancel</button></div></div><div class="upload-modal" id="chatModal"><div class="card" style="max-width:380px"><h3 id="chatWith" style="font-size:14px">Chat</h3><div class="chat-box" id="chatBox"></div><input id="msgText" placeholder="Type message..."><button class="btn btn-pink" style="width:100%;margin-top:8px;padding:10px" onclick="sendMsg()">Send</button><button class="btn btn-white" style="width:100%;margin-top:6px;padding:9px" onclick="closeChat()">Close</button></div></div><script>let currentUser=JSON.parse(localStorage.getItem('zyn_user')||'null');let isLogin=false;let uploadType='video';let chatUser=null;function init(){if(currentUser){document.getElementById('authBox').classList.add('hidden');document.getElementById('userName').innerText='@'+currentUser.username;document.getElementById('logoutBtn').style.display='inline-block';}loadFeed();loadUsers();}function toggleAuth(){isLogin=!isLogin;document.getElementById('authTitle').innerText=isLogin?'Login':'Create Account';document.getElementById('fullName').style.display=isLogin?'none':'block';document.getElementById('toggleText').innerText=isLogin?'Need account? Create':'Already have account? Login';}async function handleAuth(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim(),f=document.getElementById('fullName').value.trim();if(!u||!p)return alert('Fill all');const url=isLogin?'/api/login':'/api/register';const body=isLogin?{username:u,password:p}:{username:u,fullName:f,password:p};const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(data.error)return alert(data.error);currentUser=data.user;localStorage.setItem('zyn_user',JSON.stringify(currentUser));location.reload();}function logout(){localStorage.removeItem('zyn_user');location.reload();}async function loadUsers(){const res=await fetch('/api/users');const users=await res.json();document.getElementById('userList').innerHTML=users.filter(u=>!currentUser||u.username!==currentUser.username).map(u=>`<div class="user-item" onclick="openChat('${u.username}')"><div class="avatar">${u.username[0].toUpperCase()}</div><div style="font-size:9px;color:#888">@${u.username.slice(0,8)}</div></div>`).join('')||'<div style="padding:8px;color:#555;font-size:11px">No users yet</div>';}async function loadFeed(){const res=await fetch('/api/videos');const videos=await res.json();const feed=document.getElementById('feed');if(videos.length===0){feed.innerHTML='<div style="text-align:center;padding:40px;color:#555;font-size:13px">No Videos Yet<br><span style="font-size:11px">Be first to upload!</span></div>';return;}feed.innerHTML=videos.map(v=>`<div class="video-card">${v.videoUrl.match(/\.(jpg|jpeg|png|gif|webp)/)?`<img src="${v.videoUrl}">`:`<video src="${v.videoUrl}" controls loop playsinline></video>`}<div class="info"><div class="user"><span>@${v.username} ${v.type==='story'?'<span style="color:#25f4ee;font-size:10px">[STORY]</span>':''}</span><span style="cursor:pointer;color:#25f4ee;font-size:11px" onclick="openChat('${v.username}')">✉ Message</span></div><div class="caption">${v.caption||''}</div><div class="actions"><span onclick="like(${v.id})">♡ ${v.likes}</span><span>↗ Share</span></div></div></div>`).join('');}async function like(id){await fetch('/api/like/'+id,{method:'POST'});loadFeed();}function openUpload(type){if(!currentUser)return alert('Login first');uploadType=type;document.getElementById('uploadTitle').innerText=type==='story'?'Upload Story':'Upload Video';document.getElementById('uploadModal').classList.add('active');}function closeUpload(){document.getElementById('uploadModal').classList.remove('active');}async function uploadContent(){const videoUrl=document.getElementById('videoUrl').value.trim(),caption=document.getElementById('caption').value.trim();if(!videoUrl)return alert('Add URL');const res=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,videoUrl,caption,type:uploadType})});const data=await res.json();if(data.error)return alert(data.error);closeUpload();loadFeed();}function openChat(username){if(!currentUser)return alert('Login first');if(username===currentUser.username)return alert('Cannot chat with yourself');chatUser=username;document.getElementById('chatWith').innerText='Chat with @'+username;document.getElementById('chatModal').classList.add('active');loadChat();}function closeChat(){document.getElementById('chatModal').classList.remove('active');chatUser=null;}async function loadChat(){if(!chatUser)return;const res=await fetch(`/api/messages?user=${currentUser.username}&with=${chatUser}`);const msgs=await res.json();document.getElementById('chatBox').innerHTML=msgs.map(m=>`<div class="msg ${m.from===currentUser.username?'me':'other'}">${m.text}</div>`).join('')||'<div style="color:#555;text-align:center;font-size:12px">No messages, say hi!</div>';document.getElementById('chatBox').scrollTop=document.getElementById('chatBox').scrollHeight;}async function sendMsg(){const text=document.getElementById('msgText').value.trim();if(!text||!chatUser)return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:currentUser.username,to:chatUser,text})});document.getElementById('msgText').value='';loadChat();}function openUsers(){document.getElementById('userList').scrollIntoView({behavior:'smooth'});}function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}setInterval(()=>{if(chatUser)loadChat();},2000);init();</script></body></html>
