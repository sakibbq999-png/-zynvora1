<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ZYNVORA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;overflow-x:hidden}.header{position:fixed;top:0;left:0;right:0;background:#000;border-bottom:1px solid #222;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;z-index:100}.logo{font-weight:900;font-size:20px;letter-spacing:2px}.btn{padding:8px 16px;border-radius:20px;border:none;font-weight:700;cursor:pointer}.btn-pink{background:#fe2c55;color:#fff}.btn-white{background:#fff;color:#000}.auth-box{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#111;border:1px solid #222;padding:25px;border-radius:15px;width:100%;max-width:350px}input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff}.feed{margin-top:60px;padding-bottom:80px}.video-card{background:#111;margin:10px;border-radius:15px;overflow:hidden;border:1px solid #222}.video-card video,.video-card img{width:100%;max-height:70vh;object-fit:contain;background:#000}.info{padding:12px}.user{font-weight:800}.caption{color:#ccc;margin-top:5px}.actions{display:flex;gap:15px;margin-top:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}.bottom div{cursor:pointer;text-align:center;font-size:12px}.upload-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}.upload-modal.active{display:flex}.hidden{display:none!important}.user-list{display:flex;gap:10px;overflow-x:auto;padding:10px;border-bottom:1px solid #222}.user-item{min-width:70px;text-align:center;cursor:pointer}.user-item .avatar{width:50px;height:50px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 5px}.chat-box{max-height:300px;overflow:auto;margin:10px 0;background:#0a0a0a;border-radius:10px;padding:10px}.msg{padding:6px 10px;margin:5px 0;border-radius:15px;max-width:80%}.msg.me{background:#fe2c55;margin-left:auto}.msg.other{background:#222}</style></head><body><div class="header"><div class="logo">ZYNVORA</div><div><span id="userName"></span> <button class="btn btn-white" id="logoutBtn" style="display:none" onclick="logout()">Logout</button></div></div><div class="auth-box" id="authBox"><div class="card"><h2 id="authTitle">Create Account</h2><input id="fullName" placeholder="Full Name"><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button class="btn btn-pink" style="width:100%;margin-top:10px" onclick="handleAuth()">Continue</button><p style="margin-top:12px;text-align:center;color:#aaa;font-size:14px"><span onclick="toggleAuth()" id="toggleText" style="cursor:pointer;text-decoration:underline">Already have account? Login</span></p></div></div><div class="feed"><div class="user-list" id="userList"></div><div id="feed"></div></div><div class="bottom"><div onclick="scrollToTop()">🏠<br>Home</div><div onclick="openUpload('video')">➕<br>Video</div><div onclick="openUpload('story')">⭐<br>Story</div><div onclick="openUsers()">👥<br>Users</div><div onclick="location.href='/admin'">👑<br>Admin</div></div><div class="upload-modal" id="uploadModal"><div class="card" style="max-width:400px"><h3 id="uploadTitle">Upload Video</h3><input id="videoUrl" placeholder="Video/Image URL"><input id="caption" placeholder="Caption"><button class="btn btn-pink" style="width:100%;margin-top:10px" onclick="uploadContent()">Upload</button><button class="btn btn-white" style="width:100%;margin-top:8px" onclick="closeUpload()">Cancel</button></div></div><div class="upload-modal" id="chatModal"><div class="card" style="max-width:400px"><h3 id="chatWith">Chat</h3><div class="chat-box" id="chatBox"></div><input id="msgText" placeholder="Type message..."><button class="btn btn-pink" style="width:100%;margin-top:10px" onclick="sendMsg()">Send</button><button class="btn btn-white" style="width:100%;margin-top:8px" onclick="closeChat()">Close</button></div></div><script>let currentUser=JSON.parse(localStorage.getItem('zyn_user')||'null');let isLogin=false;let uploadType='video';let chatUser=null;function init(){if(currentUser){document.getElementById('authBox').classList.add('hidden');document.getElementById('userName').innerText='@'+currentUser.username;document.getElementById('logoutBtn').style.display='inline-block';}loadFeed();loadUsers();}function toggleAuth(){isLogin=!isLogin;document.getElementById('authTitle').innerText=isLogin?'Login':'Create Account';document.getElementById('fullName').style.display=isLogin?'none':'block';document.getElementById('toggleText').innerText=isLogin?'Need account? Create':'Already have account? Login';}async function handleAuth(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim(),f=document.getElementById('fullName').value.trim();if(!u||!p)return alert('Fill all');const url=isLogin?'/api/login':'/api/register';const body=isLogin?{username:u,password:p}:{username:u,fullName:f,password:p};const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(data.error)return alert(data.error);currentUser=data.user;localStorage.setItem('zyn_user',JSON.stringify(currentUser));location.reload();}function logout(){localStorage.removeItem('zyn_user');location.reload();}async function loadUsers(){const res=await fetch('/api/users');const users=await res.json();document.getElementById('userList').innerHTML=users.filter(u=>!currentUser||u.username!==currentUser.username).map(u=>`<div class="user-item" onclick="openChat('${u.username}')"><div class="avatar">${u.username[0].toUpperCase()}</div><div style="font-size:12px">@${u.username}</div></div>`).join('')||'<div style="padding:10px;color:#888">No users yet</div>';}async function loadFeed(){const res=await fetch('/api/videos');const videos=await res.json();const feed=document.getElementById('feed');if(videos.length===0){feed.innerHTML='<div style="text-align:center;padding:50px;color:#888">No Videos Yet<br>Be first to upload!</div>';return;}feed.innerHTML=videos.map(v=>`<div class="video-card">${v.videoUrl.match(/\.(jpg|jpeg|png|gif|webp)/)?`<img src="${v.videoUrl}">`:`<video src="${v.videoUrl}" controls loop playsinline></video>`}<div class="info"><div class="user">@${v.username} ${v.type==='story'?'(Story)':''} <span style="float:right;cursor:pointer" onclick="openChat('${v.username}')">💬 Message</span></div><div class="caption">${v.caption||''}</div><div class="actions"><span onclick="like(${v.id})">❤️ ${v.likes}</span></div></div></div>`).join('');}async function like(id){await fetch('/api/like/'+id,{method:'POST'});loadFeed();}function openUpload(type){if(!currentUser)return alert('Login first');uploadType=type;document.getElementById('uploadTitle').innerText=type==='story'?'Upload Story':'Upload Video';document.getElementById('uploadModal').classList.add('active');}function closeUpload(){document.getElementById('uploadModal').classList.remove('active');}async function uploadContent(){const videoUrl=document.getElementById('videoUrl').value.trim(),caption=document.getElementById('caption').value.trim();if(!videoUrl)return alert('Add URL');const res=await fetch('/api/videos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,videoUrl,caption,type:uploadType})});const data=await res.json();if(data.error)return alert(data.error);closeUpload();loadFeed();alert('Uploaded!');}function openChat(username){if(!currentUser)return alert('Login first');if(username===currentUser.username)return alert('Cannot chat with yourself');chatUser=username;document.getElementById('chatWith').innerText='Chat with @'+username;document.getElementById('chatModal').classList.add('active');loadChat();}function closeChat(){document.getElementById('chatModal').classList.remove('active');chatUser=null;}async function loadChat(){if(!chatUser)return;const res=await fetch(`/api/messages?user=${currentUser.username}&with=${chatUser}`);const msgs=await res.json();document.getElementById('chatBox').innerHTML=msgs.map(m=>`<div class="msg ${m.from===currentUser.username?'me':'other'}">${m.text}</div>`).join('')||'<div style="color:#888;text-align:center">No messages, say hi!</div>';document.getElementById('chatBox').scrollTop=document.getElementById('chatBox').scrollHeight;}async function sendMsg(){const text=document.getElementById('msgText').value.trim();if(!text||!chatUser)return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:currentUser.username,to:chatUser,text})});document.getElementById('msgText').value='';loadChat();}function openUsers(){document.getElementById('userList').scrollIntoView({behavior:'smooth'});}function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}setInterval(()=>{if(chatUser)loadChat();},2000);init();</script></body></html>
